name: Watch Unclaims

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run watcher
        run: python3 watch_unclaims.py

      - name: Commit updated state
        run: |
          git config --global user.name "unclaim-bot"
          git config --global user.email "unclaim-bot@users.noreply.github.com"
          git add watcher_state.json unclaims_log.txt
          git diff --quiet --cached || git commit -m "Update watcher state [skip ci]"
          git push
